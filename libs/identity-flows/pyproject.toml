[project]
name = "scholarspace-identity-flows"
version = "0.1.0"
description = "scholarspace-identity 流程引擎 —— Stage + Policy 编排"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

# ⚠️ 只依赖 identity-core —— 不依赖任何 Web 框架或数据库。
#    流程引擎是纯逻辑，可以脱离 HTTP 单独测试与复用。
dependencies = [
    "scholarspace-identity-core>=0.1,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_flows"]

[tool.hatch.build.targets.sdist]
include = ["src/identity_flows", "README.md"]

[tool.ruff]
extend = "./ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers --tb=short"
