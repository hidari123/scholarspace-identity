[project]
name = "scholarspace-identity-http"
version = "0.1.0"
description = "scholarspace-identity HTTP 接口层 —— FastAPI 路由 + 存储"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

dependencies = [
    "scholarspace-identity-core>=0.1,<0.2",
    "scholarspace-identity-flows>=0.1,<0.2",
    "scholarspace-identity-providers>=0.1,<0.2",
    "fastapi>=0.115",
    "pydantic[email]>=2.10",
]

[project.optional-dependencies]
postgres = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "bcrypt>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_http"]

[tool.hatch.build.targets.sdist]
include = ["src/identity_http", "README.md"]

[tool.ruff]
extend = "./ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers --tb=short"
