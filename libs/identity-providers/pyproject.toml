[project]
name = "scholarspace-identity-providers"
version = "0.1.0"
description = "scholarspace-identity 各登录方式适配 —— 邮箱密码 / 微信 / Google / GitHub"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

dependencies = [
    "scholarspace-identity-core>=0.1,<0.2",
    "httpx>=0.28",
]

[project.optional-dependencies]
# argon2 是可选的 —— 装不上时用 BcryptHasher 顶替
hashing = ["argon2-cffi>=23.1"]
bcrypt = ["bcrypt>=4.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
    "argon2-cffi>=23.1",
    "bcrypt>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_providers"]

[tool.hatch.build.targets.sdist]
include = ["src/identity_providers", "README.md"]

[tool.ruff]
extend = "./ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers --tb=short"
